<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zehn Kronen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/public/style.css">
<style>
/* Layout: vollflächige isometrische Stadt, Ressourcenleiste oben, Gebäude-Blatt von unten */
body.playing{overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block}
.maplabels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.mapbadge{position:absolute;left:0;top:0;display:none;padding:2px 9px;border-radius:12px;border:2px solid #e9d9a8;color:#f4efe0;font:700 14px 'Alegreya Sans',sans-serif;text-shadow:0 1px 2px #15110c;white-space:nowrap;transform-origin:50% 100%;will-change:transform}
.mapbadge.march{background:#15110ce0!important}
.topbar{position:fixed;top:0;left:0;right:0;z-index:5;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(var(--bg) 62%, rgba(27,31,36,0));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.topbar > *{pointer-events:auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-size:20px;letter-spacing:.02em;color:var(--brass);display:inline}
.brand small{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-left:8px}
.speed{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.speed b{color:var(--brass)}
.speed.off{color:var(--bad)}
.res{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.res-cell{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 7px 6px;min-width:0}
.res-top{display:flex;align-items:center;gap:5px;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap;overflow:hidden}
.res-rate{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.res-rate.neg{color:var(--bad)}
.res-bar{height:3px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden}
.res-bar i{display:block;height:100%;background:var(--muted)}
.res-bar i.full{background:var(--bad)}
.hud{position:fixed;z-index:4;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.chip{background:rgba(35,40,48,.92);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.chip .mini{width:46px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.chip .mini i{display:block;height:100%;background:var(--brass)}
.hint{color:var(--muted)}
body.sheet-open .hud{display:none}
.toast{position:fixed;z-index:9;left:50%;top:calc(env(safe-area-inset-top,0px) + 120px);transform:translateX(-50%);background:var(--bad);color:var(--brass-ink);padding:8px 14px;border-radius:8px;font-weight:700;max-width:calc(100% - 32px)}
.sheet{position:fixed;z-index:6;left:0;right:0;bottom:0;max-height:64%;overflow-y:auto;touch-action:pan-y;background:var(--panel);border-top:2px solid var(--brass);border-radius:14px 14px 0 0;padding-top:16px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transform:translateY(105%);transition:transform .22s ease;box-shadow:0 -10px 30px rgba(0,0,0,.35)}
body.sheet-open .sheet{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet-inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sh-head{display:flex;align-items:center;gap:10px}
.sh-head h2{margin:0;font-size:24px;line-height:1.1;text-wrap:balance}
.lvl{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;color:var(--brass);white-space:nowrap}
.close{margin-left:auto;background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px;color:var(--muted)}
.desc{margin:0;color:var(--muted);line-height:1.45;max-width:62ch}
.stats{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14px}
.stats dt{color:var(--muted)}
.stats dd{margin:0;font-variant-numeric:tabular-nums}
.stats .up{color:var(--good)}
.costs{display:flex;flex-wrap:wrap;gap:6px 12px;font-variant-numeric:tabular-nums;font-size:14px}
.cost{display:inline-flex;align-items:center;gap:5px}
.cost.short{color:var(--bad)}
.why{font-size:13px;color:var(--bad)}
.time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:1;min-width:80px}
.prog i{display:block;height:100%;background:var(--brass)}
.unit{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 0;border-top:1px solid var(--line)}
.unit:first-of-type{border-top:0;padding-top:0}
.unit-name{font-weight:700}
.unit-stats{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;gap:4px;grid-row:span 2;align-self:center}
.stepper button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.qty{display:flex;flex-direction:column;gap:6px;align-items:stretch;grid-row:span 2;align-self:center;width:170px;max-width:100%}
.qty .stepper{grid-row:auto;justify-content:center}
.qn{width:68px;height:34px;text-align:center;font:inherit;font-weight:700;font-variant-numeric:tabular-nums;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:0 4px;-moz-appearance:textfield}
.qn::-webkit-outer-spin-button,.qn::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qr{width:100%;height:26px;margin:0;accent-color:var(--accent,#c9a24a);touch-action:pan-y}
.uact .qty{grid-row:auto}
.stepper output{min-width:38px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.train-row{display:flex;align-items:center;gap:10px;font-size:13px;font-variant-numeric:tabular-nums}
.troops{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;font-variant-numeric:tabular-nums}
.troops span b{color:var(--brass)}

/* Navigation unten, Berichte, Karte */
:root{--nav:calc(58px + env(safe-area-inset-bottom,0px))}
.nav{position:fixed;z-index:8;left:0;right:0;bottom:0;height:var(--nav);padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(0,0,0,.28)}
.nav button{background:none;border:0;color:var(--muted);font-size:15px;font-weight:700;letter-spacing:.03em;position:relative;border-top:3px solid transparent}
.nav button.on{color:var(--brass);border-top-color:var(--brass)}
.badge{position:absolute;top:8px;margin-left:6px;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:1px 6px}
.hud{bottom:calc(var(--nav) + 10px)}
.chip.go{pointer-events:auto;color:var(--ink);font-family:inherit;cursor:pointer;border-color:var(--brass)}
.sheet{bottom:var(--nav);max-height:min(62%,calc(100% - var(--nav) - 110px));padding-bottom:20px;transform:translateY(calc(105% + var(--nav)))}
.panel{position:fixed;z-index:7;left:0;right:0;top:0;bottom:var(--nav);overflow-y:auto;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-left,0px)) 24px;touch-action:pan-y}
body.reports-open{touch-action:auto}
.report{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:10px 12px;margin-top:8px}
.report.win{border-left-color:var(--good)}
.report.new{background:var(--panel-2)}
.report summary{display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.report[open] summary{margin-bottom:8px}
table.rep{width:100%;table-layout:fixed;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;margin:6px 0}
table.rep th,table.rep td{padding:3px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;border-bottom:1px solid var(--line)}
table.rep th:first-child,table.rep td:first-child{text-align:left;width:34%}
table.rep th{color:var(--muted);font-weight:500}
.loading{position:fixed;z-index:20;inset:0;display:grid;place-items:center;background:rgba(15,18,22,.82);font-size:20px;color:var(--brass)}
.btn.small{padding:4px 12px;font-size:13px}
.picker h3{display:flex;align-items:center;justify-content:space-between}
.picker .quick{display:flex;gap:6px}
.picker .unit{padding:6px 0}
.picker .stepper button{width:32px;height:32px}
.sheet-inner{gap:10px}
.stats{gap:3px 14px;font-size:13.5px}
body.mode-map .hint{display:none}
body.reports-open #stage{visibility:hidden}

/* Stadtmenü */
body:not(.mode-map) #stage{display:none}
body:not(.mode-map) .hud{display:none}
.sh-img{width:100%;height:110px;object-fit:cover;object-position:50% 72%;border-radius:10px;display:block}
.res-name{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud{bottom:calc(var(--nav) + 10px)}
.chip.go{pointer-events:auto;color:var(--ink);font-family:inherit;cursor:pointer;border-color:var(--brass)}
.sheet{bottom:var(--nav);max-height:min(62%,calc(100% - var(--nav) - 110px));padding-bottom:20px;transform:translateY(calc(105% + var(--nav)))}
.panel{position:fixed;z-index:7;left:0;right:0;top:0;bottom:var(--nav);overflow-y:auto;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-left,0px)) 24px;touch-action:pan-y}
body.reports-open{touch-action:auto}

.report.win{border-left-color:var(--good)}
.report.new{background:var(--panel-2)}
.report summary{display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.report[open] summary{margin-bottom:8px}
table.rep{width:100%;table-layout:fixed;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;margin:6px 0}
table.rep th,table.rep td{padding:3px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;border-bottom:1px solid var(--line)}
table.rep th:first-child,table.rep td:first-child{text-align:left;width:34%}
table.rep th{color:var(--muted);font-weight:500}
.loading{position:fixed;z-index:20;inset:0;display:grid;place-items:center;background:rgba(15,18,22,.82);font-size:20px;color:var(--brass)}
.btn.small{padding:4px 12px;font-size:13px}

.picker .quick{display:flex;gap:6px}
.picker .unit{padding:6px 0}
.picker .stepper button{width:32px;height:32px}
.sheet-inner{gap:10px}
.stats{gap:3px 14px;font-size:13.5px}

body.reports-open #stage{visibility:hidden}

/* Stadtmenü */
body:not(.mode-map) #stage{display:none}
body:not(.mode-map) .hud{display:none}
.hud{bottom:calc(var(--nav) + 10px)}


/* Anmeldung */
.auth{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.auth-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.auth-card h1{margin:0;font-size:40px;color:var(--brass);line-height:1}
.auth-card .lead{margin:0;color:var(--muted);line-height:1.45}
.auth-card form{display:flex;flex-direction:column;gap:12px}
.linkish{background:none;border:0;color:var(--brass);padding:0;text-decoration:underline;font-size:14px;align-self:flex-start}

/* Shop, Beschleuniger, Bündnislager, Teleporter */
.spd{margin-left:8px;border:1px solid #8a6a24;background:linear-gradient(#f3d77a,#c9962c);color:#3b2608;border-radius:999px;min-width:34px;min-height:34px;font-size:16px;cursor:pointer;box-shadow:0 1px 0 #fff8 inset,0 2px 4px #0005}
.spd:active{transform:translateY(1px)}
.train-row .spd{flex:none}
.modal-in .mrow,.shopi{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.modal-in .mrow>div:first-child{flex:1;min-width:0}
.modal-in .mrow .row{margin:0;flex:none;flex-direction:column;align-items:stretch;gap:6px}
.shopi .tico{font-size:28px;flex:none}
.shopi>div{flex:1;min-width:0}
.donate{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:8px 0}
.donate label{display:flex;flex-direction:column;font-size:12px;color:var(--muted)}
.donate input{box-sizing:border-box;width:100%;min-width:0;margin-top:2px;min-height:40px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:#fffaf0;color:var(--ink);font-size:16px}
.tpbox{border:1px solid #5aa8d8;background:linear-gradient(#e3f4ff,#f6edd2)}
.tpflash{position:fixed;inset:0;z-index:30;pointer-events:none;background:radial-gradient(circle at 50% 55%,#fff 0,#bfe9ff 35%,#0000 75%);opacity:0;animation:tpf 1.25s ease-out}
@keyframes tpf{0%{opacity:0}18%{opacity:.85}45%{opacity:.15}62%{opacity:.7}100%{opacity:0}}

.placebtn{position:fixed;z-index:6;right:16px;top:calc(env(safe-area-inset-top,0px) + 150px);border:2px solid #8a6a24;background:linear-gradient(#f3d77a,#c9962c);color:#3b2608;border-radius:50%;width:40px;height:40px;padding:0;display:grid;place-items:center;font-size:19px;line-height:1;box-shadow:0 3px 8px #0007;cursor:pointer}
.placebtn.tp{top:calc(env(safe-area-inset-top,0px) + 198px);background:linear-gradient(#bfe6ff,#5aa8d8);border-color:#2f6a94;color:#08283f}
.placebtn[hidden],.placebar [hidden],.placebar[hidden],.placeinfo[hidden]{display:none}
.placeinfo{position:fixed;z-index:6;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 112px);display:flex;flex-wrap:wrap;gap:5px;justify-content:center;pointer-events:none}
.placeinfo span{background:#f6edd2ee;color:#2e2012;border:2px solid #7a5230;border-radius:999px;padding:2px 9px;font-size:14px;font-weight:700;box-shadow:0 2px 6px #0006}
.placeinfo span.z{opacity:.6;font-weight:400}
.placebar{position:fixed;z-index:7;left:12px;right:12px;bottom:calc(var(--nav) + 64px);background:#f6edd2;color:#2e2012;border:3px solid #7a5230;border-radius:14px;padding:12px;box-shadow:0 4px 14px #000a}
.placebar .pl-txt{font-size:14px;margin-bottom:8px}.placebar .pl-txt.bad{color:#9a2a1c}.placebar .pl-txt.ok{color:#2c6a2f}
.placebar .row{display:flex;gap:8px;justify-content:flex-end;margin:0}
.placebar .btn.ghost{color:#2e2012;border-color:#c9b27f}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}.sw{width:36px;height:36px;border-radius:50%;border:2px solid #7a5230;cursor:pointer}.sw.on{outline:3px solid #2e2012;outline-offset:2px}
.placebar .row{flex-wrap:wrap}.placebar .btn:disabled{opacity:.45}

.store{background:linear-gradient(#5a3a1c,#3d2713);color:#fbeec9;border:2px solid #c9962c;border-radius:12px;padding:14px;margin:-4px -4px 12px;box-shadow:0 2px 0 #fff3 inset,0 3px 8px #0004}
.store h2{margin:0 0 4px;font-size:26px;color:#f3d77a !important;text-align:center;letter-spacing:.04em}
.store .stock-sub{margin:4px 0;text-align:center;font-size:13px;color:#e9d9b0}
.store .stock-sub .costs{display:inline}
.stock{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.stk{background:#2a1a0c;border:1px solid #8a6a24;border-radius:10px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px}
.stk b{font-size:28px;line-height:1.1;color:#fff6dd;font-variant-numeric:tabular-nums}
.stk span{font-size:12px;color:#d9c796}
.stk small{font-size:11px;font-weight:700}
.stk.ok small{color:#8be28f}.stk.low small{color:#ff9c8a}
.stk .r{font-size:22px}
</style>

<style>
/* Bündnis, Banner, Mehr, Ergebnis */
.nav{grid-template-columns:repeat(6,1fr)!important}
.nav button{font-size:13px!important;padding:0 2px}
#banner{display:flex;flex-direction:column;gap:3px;padding:0 max(10px,env(safe-area-inset-left,0px))}
#banner:empty{display:none}
.bn{font-size:13px;font-weight:700;border-radius:6px;padding:4px 9px;border:1px solid transparent;line-height:1.3}
.stats .bad{color:#9a2a1c;font-weight:700}
.bn.bad{background:#5a1d17;color:#ffd9d2;border-color:#a33a2e}
.bn.warn{background:#4d3a14;color:#f4dfa8;border-color:#8a6a24}
.bn.good{background:#1d3b25;color:#cdeed2;border-color:#3f7d4c}
.bn.info{background:#262a33;color:#d8dde8;border-color:#465066}
.toast.info{background:#3b3320;color:#f4e6bd;border:1px solid #8a6a24}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mrow>div{min-width:0}
.mrow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:5px;background:#3a3020;color:#e2b86a;border:1px solid #6b5420;vertical-align:middle}
.msgs{max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.msg{font-size:14px;line-height:1.35;word-break:break-word}
.msg b{color:#e2b86a}.msg small{color:var(--muted);margin-left:6px}
.chatform{display:flex;gap:8px}.chatform input{flex:1;min-width:0}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.seg button{flex:1;min-width:84px}
details.acc{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;background:#00000022}
details.acc>summary{cursor:pointer;padding:12px 14px;font-weight:700;font-size:16px;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:'▾';color:var(--muted)}
details.acc[open]>summary::after{content:'▴'}
details.acc>.acc-in{padding:0 14px 14px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:15px;line-height:1.35}
.chk i{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid #6b5420;display:grid;place-items:center;font-style:normal;font-size:13px;color:#1b1712;margin-top:1px}
.chk.done i{background:#d9b25c}.chk.done span{color:var(--muted);text-decoration:line-through}
table.rank{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.rank th,table.rank td{text-align:left;padding:5px 6px;border-top:1px solid var(--line)}
table.rank th{border-top:0;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
table.rank tr.me td{color:#e2b86a;font-weight:700}
.modal{position:fixed;z-index:20;inset:0;background:#000b;display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.modal-in{background:var(--bg);border:2px solid #8a6a24;border-radius:14px;max-width:460px;width:100%;max-height:86vh;overflow-y:auto;padding:20px}
.modal-in h2{margin:0 0 6px;font-size:26px;color:var(--brass)}
.crown{font-size:44px;text-align:center}
.links{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin-top:6px}
.links a{color:#d9b25c}
.btn.danger{background:#8a2b24;color:#fff}
</style>
<style>
/* ===== Neue Stadt: Holz und Pergament ===== */
.parch{--bg:#e9dcb8;--panel:#f6edd2;--panel-2:#ecdfbb;--line:#c9b27f;--ink:#2e2012;--muted:#6d5a3b;--brass:#8a5412;--brass-ink:#fff6dd;--good:#3d6b2b;--bad:#a5321e;--food:#b8921e;--wood:#7d4f24;--stone:#7c7a73;--ore:#57728c;--gold:#b88a14;color-scheme:light;color:var(--ink)}

  background:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 2px,transparent 2px 92px),repeating-linear-gradient(0deg,rgba(255,235,190,.035) 0 1px,transparent 1px 6px),linear-gradient(#3b2415,#26160b)}

#cityStage{position:absolute;inset:0}#cityStage canvas{display:block;width:100%;height:100%;touch-action:none}
.clabels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cb{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:2px;will-change:transform}

.cbtns{position:fixed;z-index:4;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(var(--nav) + 16px);display:flex;flex-direction:column;gap:10px}

.rbtn{width:56px;height:56px;border-radius:50%;border:3px solid #e8c36a;background:radial-gradient(circle at 35% 28%,#6a4a2c,#2a1a0c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;box-shadow:0 4px 12px rgba(0,0,0,.55),inset 0 0 0 2px rgba(0,0,0,.35);cursor:pointer;padding:0}
.rbtn span{font-size:21px;line-height:1}.rbtn small{font-size:9px;color:#f1dca0;letter-spacing:.3px}
.cdrawer{position:fixed;z-index:5;left:50%;bottom:calc(var(--nav) + 10px);width:min(96vw,720px);max-height:min(72%,calc(100% - var(--nav) - 120px));display:flex;flex-direction:column;background:var(--panel);border:1px solid #e0b86699;border-radius:20px;box-shadow:0 18px 44px rgba(0,0,0,.6);transform:translate(-50%,115%);transition:transform .28s cubic-bezier(.2,.8,.2,1);pointer-events:none;visibility:hidden}
.cdrawer.open{transform:translate(-50%,0);pointer-events:auto;visibility:visible}
.cdhead{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid rgba(232,195,106,.3);color:#f6e7bd;font-family:var(--f-display);font-size:19px}
.cdhead .close{width:32px;height:32px;border-radius:50%;border:2px solid #e8c36a;background:#2a1a0c;color:#f6e7bd;cursor:pointer;font-size:14px}
.cdbody{overflow-y:auto;overscroll-behavior:contain;padding:12px;-webkit-overflow-scrolling:touch}
.city-in{max-width:400px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.scene{position:relative;border-radius:14px;overflow:hidden;border:3px solid #7a5230;box-shadow:0 0 0 2px #1d1108,0 12px 26px rgba(0,0,0,.55);aspect-ratio:2.1/1;cursor:pointer}

.scene::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 44px rgba(0,0,0,.5);pointer-events:none}
.scene-t{position:absolute;left:0;right:0;bottom:0;padding:30px 12px 10px;background:linear-gradient(transparent,rgba(24,14,6,.92));display:flex;align-items:flex-end;justify-content:space-between;gap:8px;z-index:1}

.shield{width:44px;height:50px;clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);background:linear-gradient(#efca74,#a8741f);display:grid;place-items:start center;padding-top:8px;font-weight:700;font-size:20px;color:#2b1a0d;flex:none}
.strip{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border:2px solid #7a5230;border-radius:12px;box-shadow:0 0 0 2px #1d1108}
.strip div{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px;border-left:1px solid var(--line)}
.strip div:first-child{border-left:0}
.strip b{font-size:18px;font-variant-numeric:tabular-nums;color:var(--brass)}
.strip span{font-size:11px;color:var(--muted);text-align:center}
.orders{background:var(--panel);border:2px solid #7a5230;border-radius:12px;box-shadow:0 0 0 2px #1d1108;padding:10px 10px 6px}
.sec{margin:0 0 8px;font-family:var(--f-display);font-size:17px;font-weight:400;letter-spacing:.04em;color:var(--brass)}
.ord{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px dashed var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;font-size:14px;color:var(--ink);font-family:inherit}
.sec+.ord{border-top:0}
.ord .bi{flex:none;width:34px;height:34px;font-size:19px;border-width:1.5px}
.ord .qmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.ord.free{color:var(--muted);font-size:13px}
.ord.go{cursor:pointer}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:-2px;position:relative;z-index:1;padding:0 4px}
.tab{position:relative;background:linear-gradient(#60401f,#3d2412);border:2px solid #1d1108;border-bottom:0;border-radius:10px 10px 0 0;color:#dcc592;padding:7px 2px 6px;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:inherit}
.tab .tico{font-size:18px;line-height:1.1}
.tab.on{background:#e9dcb8;color:#2e2012;padding-bottom:9px}
.cbadge{position:absolute;top:-7px;right:4px;min-width:20px;height:20px;border-radius:10px;padding:0 5px;display:grid;place-items:center;background:#e0b45a;color:#2b1a0d;font-weight:700;font-size:12px;border:1.5px solid #1d1108}
.tabbody{background:#e9dcb8;border:2px solid #1d1108;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:7px;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.note-box{font-size:13.5px;line-height:1.4;color:var(--muted);background:var(--panel-2);border:1px dashed var(--line);border-radius:8px;padding:8px 10px}
.plate{display:grid;grid-template-columns:50px 1fr;gap:5px 10px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:7px;cursor:pointer;box-shadow:0 2px 0 rgba(90,60,20,.28);transition:transform .1s}
.plate:active{transform:scale(.99)}
.pimg{position:relative;width:50px;height:50px;align-self:start}
.bi{display:grid;place-items:center;width:100%;height:100%;font-size:27px;line-height:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3d58c,#a8741f);border:2px solid #2b190c;box-shadow:0 2px 5px rgba(0,0,0,.45)}
.plate.empty .bi{filter:grayscale(.7) brightness(.85)}.plate.locked .bi{filter:grayscale(1) brightness(.6)}
.burg{display:flex;flex-direction:column;align-items:center;gap:1px;color:#f6e7bd;cursor:pointer;font-family:var(--f-display);font-size:21px;text-shadow:0 2px 0 rgba(0,0,0,.6)}.burg span{font:13px var(--f-body,inherit);color:#d9c595}
.plate.locked{opacity:.78}
.ribbon{position:absolute;left:-5px;top:-4px;background:linear-gradient(#efca74,#b0801f);color:#2b1a0d;font-weight:700;padding:1px 10px 1px 7px;border-radius:0 9px 9px 0;font-size:14px;box-shadow:0 2px 3px rgba(0,0,0,.45)}
.btag{position:absolute;bottom:-3px;right:-4px;background:#2b1a0d;color:#efca74;border-radius:999px;font-size:11px;font-weight:700;padding:2px 8px}
.ptext{min-width:0;display:flex;flex-direction:column;gap:3px}
.pname{font-family:var(--f-display);font-size:18px;line-height:1.05}
.pmeta{font-size:13px;color:var(--muted);line-height:1.32}
.pmeta b{color:var(--ink)}
.pact{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:6px 10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:7px}
.pact .btn{margin-left:auto;flex:none}
.pact .bprog{margin-left:auto}
.pact .costs.sm{font-size:12.5px;gap:2px 10px}
.pact .one{flex-basis:100%;font-size:12px;line-height:1.3}
.pact .note.one{color:var(--muted)}
.bprog{display:flex;align-items:center;gap:8px;width:100%}
.pips{display:flex;gap:4px}
.pips i{width:12px;height:12px;transform:rotate(45deg);border:1.5px solid #7a5230;background:transparent;border-radius:2px}
.pips i.on{background:linear-gradient(#efca74,#b0801f)}
.nav{background:linear-gradient(#3d2412,#25150a)!important;border-top:2px solid #a77b36!important}
.nav button{color:#cdb17a!important}
.nav button.on{color:#f3d58c!important;border-top-color:#f3d58c!important}
.sheet.parch{background:var(--panel);border-top:3px solid #7a5230;box-shadow:0 -8px 24px rgba(0,0,0,.5)}
.sheet.parch .block{background:var(--panel-2)}
.sheet.parch .stepper button{background:var(--panel);color:var(--ink)}
.sheet.parch .btn.ghost{color:var(--ink);border-color:var(--line)}
.sheet.parch h2{color:var(--ink)}
.sheet.popup{left:50%;right:auto;width:min(94vw,520px);bottom:calc(var(--nav) + 12px);max-height:min(66%,calc(100% - var(--nav) - 120px));padding:0;border:1px solid #e0b86688;border-radius:22px;background:linear-gradient(180deg,#f9f1d8,#efe1b9);box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 2px #7a5230,inset 0 1px 0 #fff9;transform:translate(-50%,36px) scale(.95);opacity:0;pointer-events:none;transition:transform .24s cubic-bezier(.2,.9,.3,1.15),opacity .18s;overscroll-behavior:contain}
body.sheet-open .sheet.popup{transform:translate(-50%,0) scale(1);opacity:1;pointer-events:auto}
.popup .sheet-inner{padding:0 16px 16px;gap:12px}
.popup .sh-head{position:sticky;top:0;z-index:2;margin:0 -16px 2px;padding:13px 14px 12px 16px;background:linear-gradient(180deg,#6a4627,#432d19);border-radius:21px 21px 0 0;border-bottom:2px solid #c99a3d;gap:12px}
.popup .sh-head h2{color:#f8ebc4;font-size:21px;text-shadow:0 1px 2px #0006}
.popup .lvl{background:linear-gradient(#e6bd62,#c99a3d);color:#2b1a0b;border:0;font-weight:700;box-shadow:0 1px 3px #0005}
.popup .close{width:34px;height:34px;padding:0;display:grid;place-items:center;border-radius:50%;border:1px solid #e0b866;color:#f8ebc4;background:#ffffff18;font-size:16px;line-height:1}
.sh-ico{flex:none;width:42px;height:42px;display:grid;place-items:center;font-size:23px;border-radius:13px;background:#ffffff1c;border:1px solid #e0b86677;box-shadow:inset 0 1px 0 #fff3}
@media (prefers-reduced-motion:reduce){.sheet.popup{transition:none}}


/* ===== Alle Menüs: Holz und Pergament ===== */
.panel{background:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 2px,transparent 2px 92px),linear-gradient(#3b2415,#26160b)!important}
.panel>.sheet-inner{--bg:#e9dcb8;--panel:#f6edd2;--panel-2:#ecdfbb;--line:#c9b27f;--ink:#2e2012;--muted:#6d5a3b;--brass:#8a5412;--good:#3d6b2b;--bad:#a5321e;color:var(--ink);background:var(--panel);border:3px solid #7a5230;border-radius:14px;box-shadow:0 0 0 2px #1d1108,0 12px 26px rgba(0,0,0,.55);padding:16px 14px 18px;margin-top:calc(env(safe-area-inset-top,0px) + 4px)}
.panel h2,.panel h3,.modal-in h2{font-family:var(--f-display);font-weight:400;letter-spacing:.03em;color:var(--brass)}
.panel .block,.panel details.acc{background:var(--panel-2);border-color:var(--line)}
.panel .btn:not(.ghost):not(.danger),.modal-in .btn:not(.ghost):not(.danger){color:#fff6dd}
.panel .btn.ghost,.panel .seg button{color:var(--ink);border-color:var(--line)}
.panel .seg button{background:var(--panel-2)}
.panel .seg button.on,.panel .seg button[aria-pressed=true]{background:#8a5412;color:#fff6dd}
.panel .tag{background:#e0cfa0;color:#6b430f;border-color:#b79a5a}
.panel table.rank tr.me td{color:#8a5412}
.panel input,.panel textarea,.panel select{background:#fffaf0;color:var(--ink);border-color:var(--line)}
.panel .muted,.panel .note{color:var(--muted)}
.modal-in{--bg:#e9dcb8;--panel:#f6edd2;--panel-2:#ecdfbb;--line:#c9b27f;--ink:#2e2012;--muted:#6d5a3b;--brass:#8a5412;background:var(--panel);color:var(--ink);border:3px solid #7a5230;box-shadow:0 0 0 2px #1d1108}
.modal-in .block{background:var(--panel-2)}
.modal-in .btn.ghost{color:var(--ink);border-color:var(--line)}

/* ===== Menüs wie ein richtiges Spiel: Kopfzeile, Reiter, Kacheln ===== */
.phead{display:flex;align-items:center;gap:12px;margin:-16px -14px 14px;padding:12px 14px;border-radius:11px 11px 0 0;background:linear-gradient(#5a3a1f,#3a2312);border-bottom:3px solid #a77b36;color:#f6e7bd;position:sticky;top:-4px;z-index:2}
.phead h2{margin:0;font-size:22px;line-height:1.1;color:#f6e7bd!important;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.phead small{display:block;font-size:12px;color:#d9c595;margin-top:2px}
.phead .tag{background:#2b190c;color:#f3d58c;border-color:#a77b36;font-size:12px;vertical-align:middle}
.ptitle{flex:1;min-width:0}
.pico{flex:none;width:42px;height:42px;display:grid;place-items:center;font-size:23px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3d58c,#a8741f);border:2px solid #2b190c;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.pback{flex:none;background:#2b190c;color:#f3d58c;border:1.5px solid #a77b36;border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px}
.ptabs{display:flex;gap:6px;margin:0 0 14px;padding:4px;border-radius:12px;background:#d9c696;border:1px solid var(--line)}
.ptab{flex:1;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;position:relative;padding:9px 6px;border:0;border-radius:9px;background:transparent;color:#6d5a3b;font-weight:700;font-size:14px}
.ptab.on{background:linear-gradient(#a8741f,#7a4e12);color:#fff6dd;box-shadow:0 2px 4px rgba(0,0,0,.35)}
.pbadge{display:inline-grid;flex:none;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:#b3321f;color:#fff;font-size:11px;font-weight:700}
.block.flat{background:none;border:0;padding:0}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 12px;text-align:left;border-radius:12px;background:linear-gradient(#f9f1d8,#ecdfbb);border:2px solid #b79a5a;color:var(--ink);box-shadow:0 3px 0 #8d7440}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 #8d7440}
.tile .tico{font-size:28px;line-height:1;margin-bottom:6px}
.tile b{font-size:16px}
.tile small{font-size:12px;color:var(--muted)}
.tile .pbadge{position:absolute;top:8px;right:8px;margin:0}
.profile{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:10px 12px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line)}
.avatar{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:24px;color:#fff;border:3px solid #7a5230;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.panel .report{background:var(--panel-2);border-color:var(--line)}
.report summary{align-items:center;justify-content:flex-start;gap:10px;list-style:none}
.report summary::-webkit-details-marker{display:none}
.ricon{flex:none;width:38px;height:38px;display:grid;place-items:center;font-size:20px;border-radius:50%;background:#e0cfa0;border:2px solid #b79a5a}
.report.win .ricon{border-color:var(--good)}.report.loss .ricon{border-color:var(--bad)}
.rt{display:flex;flex-direction:column;min-width:0}.rt small{color:var(--muted);font-size:12px}
.panel .msg{background:#fffaf0;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:6px 0;max-width:88%}
.panel .msg.mine{margin-left:auto;background:#f3e2b3}
.panel .mrow{border-color:var(--line)}
/* Navigationsleiste mit Symbolen */
.nav button{display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.nav button i{font-style:normal;font-size:21px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.nav button span:not(.badge){font-size:12px}
.nav button:not(.on) i{opacity:.75}
.nav .badge{top:4px!important}
.nav button span:not(.badge){font-size:11px!important;letter-spacing:0}
.ucard{margin:0 0 10px;padding:12px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line)}
.uact .stepper{grid-row:auto}
.ucard.locked{opacity:.65}
.spn{font-size:20px;margin-left:auto;padding-left:10px}
.uov{width:100%;table-layout:fixed;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink)}.uov th{font-weight:600;color:var(--muted);text-align:right;padding:2px 3px;font-size:11px;white-space:nowrap}.uov th:first-child,.uov td:first-child{text-align:left;width:38%}.uov td{padding:4px 3px;text-align:right;border-top:1px dashed var(--line);color:var(--ink)}.uov td:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.uov small{display:block;font-size:10px;color:var(--muted)}.uov tr.zero td{opacity:.5}
.uhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.uhead b{font-family:var(--f-display);font-weight:400;font-size:19px;color:var(--brass);display:block}
.uhead small,.utime{font-size:12px;color:var(--muted)}
.ustats{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 10px;font-size:14px;font-variant-numeric:tabular-nums}
.uact{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.panel .strip{margin:0 0 12px;grid-template-columns:repeat(3,1fr);box-shadow:none;border-width:1px}
.panel .train-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px dashed var(--line)}
.panel .prog{flex:1}
</style>
</head>
<body>
<main class="auth" id="auth" hidden>
  <div class="auth-card">
    <h1>Zehn Kronen</h1>
    <p class="lead" id="authLead">Melde dich an, um deine Stadt zu regieren.</p>
    <form id="authForm" novalidate>
      <div class="field"><label for="fName">Name</label><input id="fName" autocomplete="username" maxlength="20" required></div>
      <div class="field"><label for="fPass">Passwort</label><input id="fPass" type="password" autocomplete="current-password" minlength="6" required></div>
      <p class="err" id="authErr" role="alert"></p>
      <button class="btn" id="authBtn" type="submit">Anmelden</button>
    </form>
    <p class="note legal"><a href="/impressum" target="_blank" rel="noopener">Impressum</a> · <a href="/datenschutz" target="_blank" rel="noopener">Datenschutz</a></p>
    <p class="note" id="authNote">Neu hier? Du brauchst einen Einladungslink vom Admin deiner Partie.</p>
  </div>
</main>

<div id="game" hidden>
  <div id="stage" aria-label="Weltkarte"></div>
  <main class="city" id="city" aria-label="Stadt">
    <div id="cityStage"></div>
    <div class="cbtns"><button type="button" class="rbtn" data-act="cdrawer" aria-label="Bauen und Verwalten"><span>🔨</span><small>Bauen</small></button><button type="button" class="rbtn" data-act="chome" aria-label="Zur Mitte"><span>🎯</span><small>Mitte</small></button></div>
    <section class="cdrawer" id="cityDrawer" aria-label="Stadt verwalten"><div class="cdhead"><b>Stadt verwalten</b><button type="button" class="close" data-act="cdrawer" aria-label="Schließen">✕</button></div><div class="cdbody" id="cityList"></div></section>
  </main>
  <header class="topbar">
    <div class="brand">
      <div><h1>Zehn Kronen</h1><small id="matchName"></small></div>
      <span class="speed" id="speed">Tempo <b>×1</b></span>
    </div>
    <div class="res" id="res"></div>
    <div id="banner"></div>
  </header>
  <div class="hud" id="hud"></div>
  <button class="placebtn" id="placeBtn" type="button" title="Außenposten" aria-label="Außenposten" hidden>🏗</button>
  <button class="placebtn tp" id="tpBtn" type="button" title="Teleportieren" aria-label="Teleportieren" hidden>🌀</button>
  <div class="placeinfo" id="placeInfo" hidden></div>
  <div class="placebar" id="placeBar" hidden><div class="pl-txt" id="placeTxt"></div><div class="row"><button class="btn ghost" type="button" id="placeCancel">Abbrechen</button><button class="btn ghost" type="button" id="placeTp">🌀 Teleport</button><button class="btn" type="button" id="placeGo">Hier bauen</button></div></div>
  <section class="sheet" id="sheet" aria-live="polite"><div class="sheet-inner" id="sheetInner"></div></section>
  <section class="panel" id="reports" hidden aria-live="polite"><div class="sheet-inner" id="reportsInner"></div></section>
  <section class="panel" id="sidePanel" hidden><div class="sheet-inner" id="sidePanelInner"></div></section>
  <div class="modal" id="modal" hidden><div class="modal-in" id="modalIn"></div></div>
  <div class="loading" id="loading" hidden>Karte wird gemalt …</div>
  <nav class="nav" id="nav" aria-label="Ansicht">
    <button type="button" data-nav="city" class="on"><i aria-hidden="true">🏰</i><span>Stadt</span></button>
    <button type="button" data-nav="map"><i aria-hidden="true">🗺️</i><span>Karte</span></button>
    <button type="button" data-nav="train"><i aria-hidden="true">⚔️</i><span>Ausbilden</span></button>
    <button type="button" data-nav="ally"><i aria-hidden="true">🛡️</i><span>Bündnis</span><span class="badge" id="allyBadge" hidden>0</span></button>
    <button type="button" data-nav="reports"><i aria-hidden="true">📜</i><span>Berichte</span><span class="badge" id="navBadge" hidden>0</span></button>
    <button type="button" data-nav="more"><i aria-hidden="true">☰</i><span>Mehr</span><span class="badge" id="moreBadge" hidden>0</span></button>
  </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module" src="/public/game.js"></script>
</body>
</html>
