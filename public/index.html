/* Layout: vollflächige isometrische Stadt, Ressourcenleiste oben, Gebäude-Blatt von unten */
body.playing{overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}

.mapbadge.march{background:#15110ce0!important}
.topbar{position:fixed;top:0;left:0;right:0;z-index:5;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(var(--bg) 62%, rgba(27,31,36,0));display:flex;flex-direction:column;gap:8px;pointer-events:none}

.brand small{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-left:8px}
.speed{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.speed b{color:var(--brass)}
.speed.off{color:var(--bad)}
.res{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.res-cell{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 7px 6px;min-width:0}
.res-top{display:flex;align-items:center;gap:5px;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap;overflow:hidden}
.res-rate{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.res-bar{height:3px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden}
.res-bar i{display:block;height:100%;background:var(--muted)}
.res-bar i.full{background:var(--bad)}
.hud{position:fixed;z-index:4;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.chip{background:rgba(35,40,48,.92);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.movebar{position:fixed;z-index:7;top:calc(env(safe-area-inset-top) + 74px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:rgba(35,40,48,.96);border:2px solid var(--brass);border-radius:999px;padding:8px 10px 8px 16px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.45);white-space:nowrap}
.movebar[hidden]{display:none}
.mprog{display:flex;align-items:center;gap:12px}.mprog .prog{height:10px;border-radius:5px}.mtime{font-variant-numeric:tabular-nums;font-weight:600;min-width:64px;text-align:right}
.trps{display:flex;flex-wrap:wrap;gap:6px}.tp{background:var(--panel-2,rgba(255,255,255,.06));border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px}.tp b{font-variant-numeric:tabular-nums}
.row.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.row.acts .btn{width:100%}

.hint{color:var(--muted)}
body.sheet-open .hud{display:none}
.toast{position:fixed;z-index:9;left:50%;top:calc(env(safe-area-inset-top,0px) + 120px);transform:translateX(-50%);background:var(--bad);color:var(--brass-ink);padding:8px 14px;border-radius:8px;font-weight:700;max-width:calc(100% - 32px)}
.sheet{position:fixed;z-index:6;left:0;right:0;bottom:0;max-height:64%;overflow-y:auto;touch-action:pan-y;background:var(--panel);border-top:2px solid var(--brass);border-radius:14px 14px 0 0;padding-top:16px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transform:translateY(105%);transition:transform .22s ease;box-shadow:0 -10px 30px rgba(0,0,0,.35)}

.sh-head{display:flex;align-items:center;gap:10px}

.costs{display:flex;flex-wrap:wrap;gap:6px 12px;font-variant-numeric:tabular-nums;font-size:14px}
.cost{display:inline-flex;align-items:center;gap:5px}

.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:1;min-width:80px}

.unit{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 0;border-top:1px solid var(--line)}
.unit:first-of-type{border-top:0;padding-top:0}
.unit-name{font-weight:700}
.unit-stats{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;gap:4px;grid-row:span 2;align-self:center}
.stepper button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.techcard{display:block;width:100%;margin-top:10px;text-align:center;cursor:pointer;border:0;font:inherit}
.tdet{margin-top:8px}.tdet summary{cursor:pointer;font-weight:700;color:var(--brass,#8a5412);padding:4px 0}
.tree{overflow-x:auto;margin:10px 0;padding:6px;border-radius:12px;background:radial-gradient(circle at 20% 30%,#35302a,#22201d);border:2px solid #7a5230;box-shadow:inset 0 0 18px rgba(0,0,0,.5);-webkit-overflow-scrolling:touch}
.treein{position:relative}.treein>svg{position:absolute;left:0;top:0;pointer-events:none}.tl{fill:none;stroke:#5b5144;stroke-width:3;stroke-linecap:round}.tl.on{stroke:#d8b25a}
.tn{position:absolute;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:linear-gradient(#f3e6c4,#dcc995);border:2px solid #8a6a24;color:#2e2012;text-align:left;cursor:pointer;font:inherit;box-shadow:0 2px 5px rgba(0,0,0,.5)}
.tn.sel{outline:3px solid #fff3c4;outline-offset:1px}.tn.lock{filter:grayscale(.85) brightness(.7)}.tn.max{border-color:#3d6b2b;background:linear-gradient(#e2edc4,#bfd394)}.tn.run{border-color:#c0392b;animation:tnp 1.6s infinite}
@keyframes tnp{50%{box-shadow:0 0 12px 2px rgba(230,195,92,.9)}}
.tni{flex:none;width:36px;height:36px;display:block}.tni .bi{width:36px;height:36px;font-size:19px}
.tnt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}.tnt b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tnt small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;color:#5d4a2c}
.tnb{height:7px;border-radius:4px;background:rgba(0,0,0,.3);overflow:hidden}.tnb i{display:block;height:100%;background:linear-gradient(#efca74,#b0801f)}
.trun{display:flex;align-items:center;gap:10px;margin:8px 0;padding:8px 10px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line)}.trb{flex:1;min-width:0}.trt{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;margin-bottom:4px}
.panel:has(.tree){padding:0;background:#25221e}.panel>.sheet-inner:has(.tree){margin:0;border:0;border-radius:0;box-shadow:none;min-height:100%;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 8px;display:flex;flex-direction:column;background:#25221e}
.sheet-inner:has(.tree) .treein{margin:auto;flex:none}.sheet-inner:has(.tree) .tree{flex:1;display:flex;min-height:calc(100% - 8px);margin:8px 0 0;overflow:auto;-webkit-overflow-scrolling:touch}
.tpop{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}.tpin{width:100%;max-width:340px;background:#f6edd2;color:#2e2012;border:3px solid #7a5230;border-radius:14px;padding:14px;box-shadow:0 0 0 2px #1d1108,0 12px 26px rgba(0,0,0,.6)}.tpin .note{color:#6d5a3b}.tbo{font-size:16px;margin:6px 0}.tpin .btn{width:100%;margin-top:6px}

.fxrow{display:flex;justify-content:space-between;font-size:13.5px;margin-top:6px}.fxbar{height:8px;border-radius:5px;background:rgba(0,0,0,.2);overflow:hidden;margin-top:2px}.fxbar i{display:block;height:100%}.fxbar i.a{background:#c0392b}.fxbar i.d{background:#2e6fb5}.fxbar i.w{background:#8d8a82}
.tlv{padding:8px 0;border-top:1px dashed var(--line)}.tlv.cur{background:rgba(201,162,74,.16);padding-left:6px;border-radius:6px}.tmeta{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin-top:3px}
.qty{display:flex;flex-direction:column;gap:6px;align-items:stretch;grid-row:span 2;align-self:center;width:170px;max-width:100%}
.qty .stepper{grid-row:auto;justify-content:center}
.qn{width:68px;height:34px;text-align:center;font:inherit;font-weight:700;font-variant-numeric:tabular-nums;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:0 4px;-moz-appearance:textfield}

.train-row{display:flex;align-items:center;gap:10px;font-size:13px;font-variant-numeric:tabular-nums}
.troops{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;font-variant-numeric:tabular-nums}
.troops span b{color:var(--brass)}

/* Navigation unten, Berichte, Karte */
:root{--nav:calc(58px + env(safe-area-inset-bottom,0px))}
.nav{position:fixed;z-index:8;left:0;right:0;bottom:0;height:var(--nav);padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(0,0,0,.28)}
.nav button{background:none;border:0;color:var(--muted);font-size:15px;font-weight:700;letter-spacing:.03em;position:relative;border-top:3px solid transparent}
.nav button.on{color:var(--brass);border-top-color:var(--brass)}
.badge{position:absolute;top:8px;margin-left:6px;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:1px 6px}
.hud{bottom:calc(var(--nav) + 10px)}
.chip.go{pointer-events:auto;color:var(--ink);font-family:inherit;cursor:pointer;border-color:var(--brass)}
.sheet{bottom:var(--nav);max-height:min(62%,calc(100% - var(--nav) - 110px));padding-bottom:20px;transform:translateY(calc(105% + var(--nav)))}
.panel{position:fixed;z-index:7;left:0;right:0;top:0;bottom:var(--nav);overflow-y:auto;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-left,0px)) 24px;touch-action:pan-y}

.report.new{background:var(--panel-2)}
.report summary{display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.report[open] summary{margin-bottom:8px}
table.rep{width:100%;table-layout:fixed;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;margin:6px 0}
table.rep th,table.rep td{padding:3px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;border-bottom:1px solid var(--line)}

/* Anmeldung */
.auth{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

body:not(.city3d) .city .cbtns{display:none}
body:not(.city3d) .city .cdhead{display:none}
#cityStage{position:absolute;inset:0}#cityStage canvas{display:block;width:100%;height:100%;touch-action:none}
#chatBtn{display:none;position:fixed;z-index:7;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(var(--nav) + 56px);width:46px;height:46px;border-radius:50%;padding:0;align-items:center;justify-content:center}
body.mode-map #chatBtn{display:flex}
body.mode-map.sheet-open #chatBtn,body.mode-map.reports-open #chatBtn{display:none}
#chatBtn .badge{position:absolute;top:-4px;right:-4px;margin:0}
#chatPop{position:fixed;z-index:12;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 8px);width:min(94vw,520px);max-height:60%;display:flex;flex-direction:column;gap:8px;padding:10px}
#chatPop[hidden]{display:none}
#chatPop .ctabs{display:flex;gap:6px;align-items:center}
#chatPop .ctabs button{flex:0 0 auto;padding:6px 12px;border-radius:999px}
#chatPop .ctabs .x{margin-left:auto;font-size:18px}
#chatPop .msgs{height:min(34vh,260px);max-height:none}
#chatPop .msg{border-radius:10px;padding:5px 9px}
#chatPop .msg.mine{margin-left:auto}
#miniPop{position:fixed;z-index:9;display:flex;align-items:center;gap:6px;padding:6px 8px;font-size:13px;font-weight:700}
#miniPop[hidden]{display:none}
#miniPop .mp-t{font-variant-numeric:tabular-nums;margin-right:2px}
.nav button{display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.nav button i{font-style:normal;font-size:21px;line-height:1}
.nav button span:not(.badge){font-size:11px}
.ptabs,.ptab{font-family:inherit}
/* Anmeldung */
.auth{background:radial-gradient(ellipse at 50% -10%,rgba(232,199,102,.22),transparent 55%),radial-gradient(ellipse at 90% 100%,rgba(60,90,140,.2),transparent 55%),#0b0f15}
.auth-card{background:linear-gradient(rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--gold-line);border-radius:22px;padding:26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(232,199,102,.08);backdrop-filter:blur(6px)}
.auth-card h1{text-align:center;font-size:42px;letter-spacing:.06em;color:var(--g1);text-shadow:0 0 24px rgba(232,199,102,.45),0 2px 0 rgba(0,0,0,.6)}

.auth-crest{display:grid;place-items:center;width:64px;height:64px;margin:0 auto -6px;border-radius:50%;background:radial-gradient(circle at 50% 28%,#34415a,#0b0f15);border:2px solid #d9a93a;color:var(--g3);font-size:30px;box-shadow:0 0 24px rgba(232,199,102,.5)}
.auth-crest .ic{width:56%;height:56%}
.auth-card .lead{text-align:center}
.linkish{color:var(--g1)}
.links a{color:var(--g1)}
/* Berichte der Karte, Hinweise */
.mrow{border-top:1px solid var(--gline)}
.report .rt b{color:#f4ecd4}
.armybtn{border-width:2.5px;box-shadow:0 0 12px color-mix(in srgb,var(--hc) 60%,transparent),0 3px 9px #000a}
</style>
</head>
<body>
<main class="auth" id="auth" hidden>
  <div class="auth-card">
    <div class="auth-crest">👑</div>
    <h1>Zehn Kronen</h1>
    <p class="lead" id="authLead">Melde dich an, um deine Stadt zu regieren.</p>
    <form id="authForm" novalidate>
      <div class="field"><label for="fName">Name</label><input id="fName" autocomplete="username" maxlength="20" required></div>
      <div class="field"><label for="fPass">Passwort</label><input id="fPass" type="password" autocomplete="current-password" minlength="6" required></div>
      <p class="err" id="authErr" role="alert"></p>
      <button class="btn" id="authBtn" type="submit">Anmelden</button>
    </form>
    <p class="note legal"><a href="/impressum" target="_blank" rel="noopener">Impressum</a> · <a href="/datenschutz" target="_blank" rel="noopener">Datenschutz</a></p>
    <p class="note" id="authNote">Neu hier? Du brauchst einen Einladungslink vom Admin deiner Partie.</p>
  </div>
</main>

<div id="game" hidden>
  <div id="stage" aria-label="Weltkarte"></div>
  <main class="city" id="city" aria-label="Stadt">
    <div id="cityStage"></div>
    <div class="cbtns"><button type="button" class="rbtn" data-act="cdrawer" aria-label="Bauen und Verwalten"><span>🔨</span><small>Bauen</small></button><button type="button" class="rbtn" data-act="chome" aria-label="Zur Mitte"><span>🎯</span><small>Mitte</small></button></div>
    <section class="cdrawer" id="cityDrawer" aria-label="Stadt verwalten"><div class="cdhead"><b>Stadt verwalten</b><button type="button" class="close" data-act="cdrawer" aria-label="Schließen">✕</button></div><div class="cdbody" id="cityList"></div></section>
  </main>
  <header class="topbar">
    <div class="brand">
      <div><h1>Zehn Kronen</h1><small id="matchName"></small></div>
      <span class="speed" id="speed">Tempo <b>×1</b></span>
    </div>
    <div class="res" id="res"></div>
    <div id="banner"></div>
  </header>
  <div class="hud" id="hud"></div>
  <button class="placebtn" id="placeBtn" type="button" title="Außenposten" aria-label="Außenposten" hidden>🏗</button>
  <button class="placebtn tp" id="tpBtn" type="button" title="Teleportieren" aria-label="Teleportieren" hidden>🌀</button>
  <div class="placeinfo" id="placeInfo" hidden></div>
  <div class="placebar" id="placeBar" hidden><div class="pl-txt" id="placeTxt"></div><div class="row"><button class="btn ghost" type="button" id="placeCancel">Abbrechen</button><button class="btn ghost" type="button" id="placeTp">🌀 Teleport</button><button class="btn" type="button" id="placeGo">Hier bauen</button></div></div>
  <section class="sheet" id="sheet" aria-live="polite"><div class="sheet-inner" id="sheetInner"></div></section>
  <section class="panel" id="reports" hidden aria-live="polite"><div class="sheet-inner" id="reportsInner"></div></section>
  <section class="panel" id="sidePanel" hidden><div class="sheet-inner" id="sidePanelInner"></div></section>
  <div class="modal" id="modal" hidden><div class="modal-in" id="modalIn"></div></div>
  <div class="loading" id="loading" hidden>Karte wird gemalt …</div>
  <button type="button" id="chatBtn" aria-label="Chat">💬<span class="badge" id="chatBadge" hidden>0</span></button>
  <div id="chatPop" hidden></div>
  <nav class="nav" id="nav" aria-label="Ansicht">
    <button type="button" data-nav="city" class="on"><i aria-hidden="true">🏰</i><span>Stadt</span></button>
    <button type="button" data-nav="tech"><i aria-hidden="true">🎓</i><span>Akademie</span></button>
    <button type="button" data-nav="map"><i aria-hidden="true">🗺️</i><span>Karte</span></button>
    <button type="button" data-nav="train"><i aria-hidden="true">⚔️</i><span>Ausbilden</span></button>
    <button type="button" data-nav="ally"><i aria-hidden="true">🛡️</i><span>Bündnis</span><span class="badge" id="allyBadge" hidden>0</span></button>
    <button type="button" data-nav="heroes"><i aria-hidden="true">🦸</i><span>Helden</span></button>
    <button type="button" data-nav="more"><i aria-hidden="true">☰</i><span>Mehr</span><span class="badge" id="moreBadge" hidden>0</span></button>
  </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module" src="/public/game.js"></script>
</body>
</html>
